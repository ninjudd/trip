name: Check
on:
  pull_request:
  push:
    branches: [main]
  # GitHub starts no workflow for a pull request that a workflow's own token
  # opened, and workflow_dispatch is the exception it allows, so a release
  # workflow can dispatch this on the release branch it pushes.
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels its earlier run. Every other run gets a
# group of its own, keyed on its run ID, so nothing cancels or replaces a run
# for a push to main, and every merged commit keeps its own result. Sharing a
# group without cancel-in-progress would not do that: GitHub keeps one pending
# run per group, so a third quick merge would cancel the second's run.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: python3 tests/release_test.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The release installer builds with TRIP_RELEASE=1, and only that build
      # may report a bare version. Any other value, 0 included, builds -dev.
      - run: cargo test --locked --test version
        env:
          TRIP_RELEASE: '1'
      - run: cargo test --locked --test version
        env:
          TRIP_RELEASE: '0'
      # The end-to-end scripts drive target/debug/trip, each with its own
      # temporary HOME and daemon. Build it again without TRIP_RELEASE.
      - run: cargo build --locked
      - name: End-to-end scripts
        run: |
          status=0
          for script in tests/*_e2e.py; do
            echo "::group::$script"
            if python3 "$script"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$script failed"
              status=1
            fi
          done
          exit $status
  msrv:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
