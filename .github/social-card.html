<!doctype html>
<!--
  The source of social-card.png, the image a link to the site previews with
  (site.image in .projector.toml). After editing this file, render it again
  from the repository root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --window-size=1200,630 --hide-scrollbars --force-device-scale-factor=1 \
      --virtual-time-budget=10000 --screenshot=.github/social-card.png \
      "file://$PWD/.github/social-card.html"
-->
<meta charset="utf-8">
<title>trip social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<style>
  :root {
    --bg: #100F0C; --surface: #171510; --surface-2: #1E1C16; --text: #ECE8DD;
    --muted: #A5A094; --faint: #6E6A5F; --border: #2B2924; --accent: #F27C2E;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(242, 124, 46, .13), transparent 62%),
      radial-gradient(700px 500px at -10% 110%, rgba(242, 124, 46, .06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: Geist, system-ui, sans-serif;
    position: relative;
  }
  body::before {
    /* A faint grid, like character cells. */
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(236, 232, 221, .035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(236, 232, 221, .035) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: linear-gradient(to right, #000 0%, transparent 70%);
  }
  .copy { position: absolute; left: 80px; top: 92px; width: 470px; }
  .repo { font: 500 22px "Geist Mono", monospace; color: var(--muted); letter-spacing: .01em; }
  .mark {
    font-size: 176px; font-weight: 600; letter-spacing: -.055em; line-height: .9;
    margin: 26px 0 30px -6px; display: flex; align-items: flex-end;
  }
  .cursor {
    display: inline-block; width: 54px; height: 128px; background: var(--accent);
    margin: 0 0 14px 18px; border-radius: 3px;
  }
  .tagline { font-size: 44px; font-weight: 500; letter-spacing: -.02em; line-height: 1.12; }
  .sub { margin-top: 18px; font-size: 25px; line-height: 1.4; color: var(--muted); }

  .term {
    position: absolute; left: 600px; top: 126px; width: 540px; height: 376px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .3);
    overflow: hidden;
  }
  .bar {
    height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3A372F; }
  .bar .title { margin-left: auto; margin-right: auto; transform: translateX(-26px);
    font: 500 15px "Geist Mono", monospace; color: var(--faint); }
  pre {
    padding: 24px 26px; font: 400 19px/1.62 "Geist Mono", monospace; color: var(--text);
    white-space: pre;
  }
  .p { color: var(--accent); }
  .m { color: var(--muted); }
  .f { color: var(--faint); }
  .a { color: var(--accent); }
  .k { display: inline-block; width: 11px; height: 22px; background: var(--text); vertical-align: -4px; margin-left: 3px; }
</style>
<body>
  <div class="copy">
    <div class="repo">ninjudd/trip</div>
    <div class="mark">trip<span class="cursor"></span></div>
    <div class="tagline">Persistent terminal sessions.</div>
    <div class="sub">Close the window. The session keeps running. No panes, no keybindings.</div>
  </div>

  <div class="term">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">trip ls</span></div>
<pre><span class="p">$</span> trip ls
<span class="m">api</span>
  <span class="a">*</span> api    zsh     main      <span class="m">~/src/api</span>
  + api-1  claude  fix-auth  <span class="m">~/src/api</span>

<span class="m">web</span>
  <span class="f">-</span> web    npm     main      <span class="m">~/src/web</span>

<span class="p">$</span> trip enter web<span class="k"></span></pre>
  </div>
</body>
